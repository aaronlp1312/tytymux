allow-external-apps = true
cursor-shape = block
fullscreen = true
use-black-ui = true

# Three-tier extra-keys layout - flattened JSON array without trailing backslashes
extra-keys = [[{"key": "F1"}, {"key": "F2"}, {"key": "F3"}, {"key": "F4"}, {"key": "F5"}, {"key": "F6"}, {"key": "F7"}, {"key": "F8"}], ["ESC", "TAB", {"key": "CTRL", "display": "⎈"}, {"key": "ALT", "display": "⎇"}, {"key": "SHIFT", "display": "⇧"}, "UP", {"key": "BACKSPACE", "display": "⌫"}, {"key": "ENTER", "display": "⏎"}], [{"key": "macro", "display": "eza", "macro": "eza -la\r"}, {"key": "macro", "display": "hist", "macro": "history\r"}, "/", "-", "LEFT", "DOWN", "RIGHT", "SPACE"]]
